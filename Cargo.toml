[workspace]
members = [
    ".",
    "crates/wm-types",
    "crates/wm-backend",
    "crates/wm-backend-headless",
    "crates/wm-config",
    "crates/wm-diagnostics",
    "crates/wm-render",
    "crates/wm-script",
    "crates/wm-scene",
    "crates/wm-core",
    "crates/wm-layout",
    "crates/wm-runtime",
    "crates/wm-input",
    "crates/wm-rules",
    "crates/wm-ipc",
    "crates/wm-hooks",
]
resolver = "3"

[workspace.package]
version = "0.26.0"
edition = "2024"
rust-version = "1.88"
license = "WTFPL"
authors = ["AMAPEKIBERT"]
repository = "https://github.com/amapekibert/horyzond"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[package]
name = "horyzond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A modular window manager and compositor."
default-run = "horyzond"

[dependencies]
wm-backend = { path = "crates/wm-backend" }
wm-backend-headless = { path = "crates/wm-backend-headless" }
wm-config = { path = "crates/wm-config" }
wm-core = { path = "crates/wm-core" }
wm-diagnostics = { path = "crates/wm-diagnostics" }
wm-layout = { path = "crates/wm-layout" }
wm-ipc = { path = "crates/wm-ipc" }
wm-hooks = { path = "crates/wm-hooks" }
wm-render = { path = "crates/wm-render" }
wm-runtime = { path = "crates/wm-runtime" }
wm-script = { path = "crates/wm-script" }
wm-types = { path = "crates/wm-types" }
serde_json = "1"

[lints]
workspace = true
